name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web → gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the single source of truth for the SDK version,
      # shared with .claude/hooks/session-start.sh
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Read package version
        id: pkg_version
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: flutter build web --wasm --base-href /enfr/ --no-web-resources-cdn --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.pkg_version.outputs.name }} --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
